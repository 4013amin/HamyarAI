<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در پنل هوشمند</title>
    <!-- لود بهینه تایلویند بدون فونت‌های گوگل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        /* پس‌زمینه توری فنی هماهنگ با بقیه صفحات */
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        }
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.375rem;
        }
        .helptext {
            display: block;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0.25rem;
            line-height: 1.4;
        }
        /* استایل‌دهی هوشمند به لیست خطاهای بالای فیلدها در ثبت‌نام */
        ul.errorlist {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 0.75rem;
            color: #fda4af;
            font-size: 0.75rem;
            list-style-type: none;
        }
        /* استایل‌دهی سراسری و هوشمند به فیلدهای ورودی جنگو */
        input[type="text"], input[type="password"] {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid #1e293b !important;
            color: #f1f5f9 !important;
            border-radius: 0.75rem !important;
            padding: 0.75rem !important;
            font-size: 0.875rem !important;
            outline: none !important;
            transition: all 0.2s !important;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15) !important;
        }
    </style>
</head>
<body class="bg-[#030712] bg-grid text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- افکت‌های نوری اتمسفریک پس‌زمینه -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/50 backdrop-blur-md rounded-2xl border border-slate-800/80 p-6 md:p-8 relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-200 to-slate-200 bg-clip-text text-transparent">ساخت حساب کاربری</h1>
            <p class="text-xs text-slate-400 mt-2">برای استفاده از دستیارهای هوشمند ثبت‌نام کنید</p>
        </div>

        <!-- فرم ثبت‌نام -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full mt-6 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-650 hover:to-violet-750 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/10 hover:shadow-indigo-500/20">
                ثبت‌نام و عضویت
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-800/60 text-xs text-slate-400">
            قبلاً ثبت‌نام کرده‌اید؟ 
            <a href="{% url 'login' %}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">ورود به حساب</a>
        </div>
    </div>
</body>
</html>
