<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در پنل هوشمند</title>
    <!-- لود بهینه تایلویند -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* استفاده از فونت‌های مدرن سیستمی بدون نیاز به لود از گوگل */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.375rem;
        }
        .helptext {
            display: block;
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0.25rem;
            line-height: 1.4;
        }
        ul.errorlist {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background-color: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-radius: 0.75rem;
            color: #fda4af;
            font-size: 0.75rem;
            list-style-type: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- افکت‌های نوری بک‌گراند -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-800 p-6 md:p-8 relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-200 to-slate-200 bg-clip-text text-transparent">ساخت حساب کاربری</h1>
            <p class="text-xs text-slate-400 mt-2">برای استفاده از دستیارهای هوشمند ثبت‌نام کنید</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full mt-6 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/10">
                ثبت‌نام و عضویت
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-800/60 text-xs text-slate-400">
            قبلاً ثبت‌نام کرده‌اید؟ 
            <a href="{% url 'login' %}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">ورود به حساب</a>
        </div>
    </div>
</body>
</html>
