<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل هوشمند</title>
    <!-- لود بهینه تایلویند بدون فونت‌های بلاک‌کننده گوگل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 0.375rem;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- افکت‌های نوری بک‌گراند -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-violet-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-800 p-6 md:p-8 relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 mb-4 shadow-lg shadow-indigo-500/20">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            </div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-200 to-slate-200 bg-clip-text text-transparent">خوش آمدید</h1>
            <p class="text-xs text-slate-400 mt-2">برای دسترسی به ایجنت‌های هوشمند وارد شوید</p>
        </div>

        <!-- پیام‌های خطا یا هشدارها -->
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-3 rounded-xl text-xs bg-slate-800/80 border border-slate-700/50 text-indigo-300">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- فرم ورود -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full mt-6 py-3 bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 text-white font-semibold rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/10">
                ورود به پنل کاربری
            </button>
        </form>

        <div class="text-center mt-6 pt-6 border-t border-slate-800/60 text-xs text-slate-400">
            هنوز ثبت‌نام نکرده‌اید؟ 
            <a href="{% url 'register' %}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">ثبت‌نام و عضویت</a>
        </div>
    </div>
</body>
</html>
